# https://github.com/half0wl/dotfiles
#
# udisks mount options (/etc/udisks2/mount_options.conf), linked by
# 04-config-storage.sh. Applies to drives mounted from Dolphin / Plasma; manual
# `mount` calls ignore it. Reference: mount_options.conf.example next to
# the link.
#
# APFS (apfs-dkms): writable and owned by the user who clicks Mount.
# Write support is experimental: back up first, unmount before unplugging.
# Change `readwrite` to `ro` below to make Dolphin mounts read-only again.

[defaults]
apfs_defaults=readwrite,uid=$UID,gid=$GID
apfs_allow=readwrite,uid=$UID,gid=$GID,vol,snap
