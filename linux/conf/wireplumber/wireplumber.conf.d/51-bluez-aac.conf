# Symlinked from dotfiles/linux/conf by 05-config-bt-audio.sh
monitor.bluez.properties = {
  # AAC first; SBC-XQ off (AirPods Max 2: left channel only in Dual Channel mode)
  bluez5.enable-sbc-xq = false
  bluez5.codecs = [ aac sbc ]
}

monitor.bluez.rules = [
  {
    matches = [ { device.name = "~bluez_card.*" } ]
    actions = {
      update-props = {
        # 0 = CBR at the negotiated max bitrate; 1-5 = VBR quality levels
        bluez5.a2dp.aac.bitratemode = 0
      }
    }
  }
]

wireplumber.settings = {
  # Don't drop to HFP (16 kHz mono) when an app opens the headset mic.
  # Pick "Headset Head Unit" manually when you actually need the AirPods Max 2 mic.
  bluetooth.autoswitch-to-headset-profile = false
}
