[ids]
*

[main]
capslock = esc
leftmeta = layer(cmd)
rightmeta = layer(cmd)
leftalt = layer(opt)
rightalt = layer(opt)

# Command = Ctrl, except these Mac-style overrides
[cmd:C]
c = C-insert
v = S-insert
tab = swapm(app_switch, A-tab)
space = A-space
q = A-f4
leftbrace = A-left
rightbrace = A-right
left = home
right = end
up = C-home
down = C-end
backspace = macro(S-home delete)
# Cmd+1..9 → Alt+1..9: tab switching
# Override per-app in ~/.config/keyd/app.conf if an app wants Ctrl+N instead (e.g. cmd.1 = C-1).
1 = A-1
2 = A-2
3 = A-3
4 = A-4
5 = A-5
6 = A-6
7 = A-7
8 = A-8
9 = A-9

# Holds Alt while Command is down, so repeated Tab cycles apps
[app_switch:A]

# Option = word-wise movement
[opt:A]
left = C-left
right = C-right
backspace = C-backspace
delete = C-delete

# Physical Ctrl+arrows -> Meta+arrows for KDE (macOS: Ctrl+Up = Mission Control,
# Ctrl+Left/Right = switch Spaces). See 22-config-kde-spaces.sh.
[control]
up = M-up
left = M-left
right = M-right
