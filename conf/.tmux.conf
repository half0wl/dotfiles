# Core config
set -g mouse on
set-option -g allow-rename off
# `all`, not `on`: panes in background windows can still reach Ghostty, so
# Claude Code's notifications arrive from any window. Hidden panes can also
# write the clipboard (OSC 52) and post notifications.
set -g allow-passthrough all
set -g focus-events on
set -g extended-keys on
set -s extended-keys-format csi-u

# Forward notification bells from every window in the attached session.
set -g bell-action any
set -g visual-bell off
set -gw monitor-bell on

# Status bar
set -g status-position bottom
set -g status-justify left

# Reload config with C-a r
bind r source-file ~/.tmux.conf

# Remap prefix C-b -> C-a
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Split panes using '|' and '-'
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Swap windows with Ctrl+Shift+Left/Right
bind-key -n C-S-Left swap-window -t -1
bind-key -n C-S-Right swap-window -t +1

# Pane styles
set -g pane-border-lines heavy
set -g pane-active-border-style 'fg=#409AD6,bg=default'

# Vi-style copy mode with system clipboard
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# Plugins
run ~/.config/tmux/plugins/dotbar.tmux
